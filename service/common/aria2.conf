# =============================================================================
# aria2 默认配置（由模块提供，首次启动时复制到数据目录）
# =============================================================================
# 这个文件就是 aria2 自己的 --conf-path 文件，选项名和 aria2 手册完全一致：
#   https://aria2.github.io/manual/en/html/aria2c.html
#
# 不要在这里设置下面这些选项 —— 它们由 run 脚本按 conf 生成并通过命令行传入，
# 命令行优先级高于本文件，写了也会被覆盖：
#   dir / input-file / save-session / dht-file-path / conf-path
#   enable-rpc / rpc-listen-port / rpc-listen-all / rpc-secret / ca-certificate
#
# 改完保存，然后重载服务：
#   sv restart /data/adb/runsvdir/service/aria2
# 想恢复出厂默认：删掉数据目录里的 aria2.conf，重启服务会自动重新生成。
#
# -----------------------------------------------------------------------------
# 这份默认值是按 Android 手机调过的，和桌面版的思路不同，主要三条：
#   1. 手机是闪存 + 小内存，少开并发、关掉预分配和 mmap，别把 I/O 打满；
#   2. 手机常年在别人家 Wi-Fi 上，上传带宽比下载金贵，BT 上传和做种都要收着点；
#   3. 手机会进 Doze、会熄屏、会切网，重试和超时要比桌面宽松，别一断网就失败。
# 每一项后面的注释都写了"为什么要这么设"，方便你按自己机型再调。
# =============================================================================

## 基础 ---------------------------------------------------------------
# 断点续传：手机随时可能被杀进程/切网，这个必须是 true。
continue=true
# 上次没下完的任务，重启后自动接着下。delta 是手机上的实际增量。
always-resume=true
max-resume-failure-tries=0

## 并发 ---------------------------------------------------------------
# 默认 5 个任务是给桌面多线程宽带的，手机上 3 个就够：既不会让 UI 卡顿，
# 也避免多个任务同时抢闪存带宽导致每个都很慢。
max-concurrent-downloads=3
# 让 aria2 按当前带宽自动增减并发（外网慢时会自动降下来，避免干等超时）。
optimize-concurrent-downloads=true

## 单文件连接数 -------------------------------------------------------
# 每服务器 8 连接 × 5 任务 = 40 个并发 TCP，在移动网络下很容易被运营商
# 或站点限速/封 IP。手机改成 4 连接，配合下面的 split 仍然是满速。
max-connection-per-server=4
split=4
# BT 专用的分片大小；1M 在手机上会让单文件切成太多块，内存和文件句柄都吃紧。
min-split-size=1M

## 限速 ---------------------------------------------------------------
# 留空 = 不限速。如果你用的是流量卡，或者发现刷视频卡了，把下面两行取消注释：
#   下载全局限速 2M/s、单任务 1M/s
#max-overall-download-limit=2M
#max-download-limit=1M
# 上传全局限速 512K/s —— 手机上传带宽小，BT 做种不限速会把网页都拖慢。
# 只在跑 BT 时生效，不影响 HTTP 下载。
max-overall-upload-limit=512K

## 重试与超时 ---------------------------------------------------------
# 手机切网（Wi-Fi <-> 4G）会短暂断流，aria2 默认的重试次数不够用。
max-tries=8
retry-wait=5
# 超过 60 秒没有任何数据、且速度低于 1K/s 就放弃这个连接重来，
# 避免一个已经"假死"的连接拖住整个任务。
timeout=60
connect-timeout=30
lowest-speed-limit=1K

## 文件写入（这是手机上最影响体验的一节）------------------------------
# /sdcard 是 FUSE 挂载，预分配大文件（-prealloc）在会非常慢且容易失败，
# Android 上实测只有 none 是稳的。千万不要改成 falloc/prealloc。
file-allocation=none
# 小于 5M 的文件不做磁盘缓存，直接写 —— 手机上大量小文件是常态，
# 每个都建缓存段反而更慢。
no-file-allocation-limit=5M
# 写缓存 32M（默认 64M）。Android 每个应用的内存上限都不高，aria2 在后台
# 被 LMK 杀掉时缓存里的数据会丢，缓存小一点反而更安全。
disk-cache=32M
# 关掉 mmap。用 mmap 写文件会让 Android 的 FUSE 层和 LMK 难以回收页面，
# 大文件下载时容易触发整个进程被杀。改成普通 write 慢一点点但稳得多。
enable-mmap=false

## 文件命名 -----------------------------------------------------------
auto-file-renaming=true
allow-overwrite=false
# 服务器给了 Last-Modified 就把文件时间改回去，相册/文件管理器排序才对。
remote-time=true
conditional-get=true
# 国内站点/网盘大量把文件名放在 Content-Disposition 里且不写 charset，
# 不开这个中文文件名会变乱码。
content-disposition-default-utf8=true

## 日志 ---------------------------------------------------------------
# 日志由 runsv 的日志子服务接管并轮转，这里只要别刷屏就行。
# 排查问题时可以把 notice 改成 info，看完记得改回来（info 会写很多）。
console-log-level=notice
summary-interval=0
download-result=hide
# 下完就删掉 .aria2 控制文件，别让下载目录堆满隐藏文件。
remove-control-file=true
# 找不到的文件（404）不保留记录，否则会话文件里会越攒越多。
save-not-found=false

## BitTorrent ---------------------------------------------------------
# 手机上的 BT 建议：少连接、限上传、下完就停。
listen-port=51413
dht-listen-port=51413
enable-dht=true
# IPv6 DHT 在移动网络下经常拿不到可用地址，还白白耗电，关掉。
enable-dht6=false
bt-enable-lpd=true
enable-peer-exchange=true
# 55 个 peer 对手机太多了，连接数一高耗电和发热都明显。25 个足够跑满带宽。
bt-max-peers=25
bt-save-metadata=true
follow-torrent=true
# 做种比例 0.5：传到下载量的一半就停。手机不是 7×24 的做种机，
# 而且很多运营商对上行有额外计费。
seed-ratio=0.5
# 下载完成后最多再做种 10 分钟就停（单位分钟）。设 0 = 一直做种。
bt-stop-timeout=600
# 只做种模式：下完立刻在后台只上传，不再占下载队列。手机上没用，关掉。
bt-detach-seed-only=false

## Tracker ------------------------------------------------------------
# aria2 需要显式给出 tracker 列表，定期用最新的列表替换下面这一行即可，
# 例如 https://github.com/XIU2/TrackersListCollection 里的 best.txt
#bt-tracker=

## 反爬 / UA ----------------------------------------------------------
# 部分站点会屏蔽 aria2 的 UA，需要时取消注释改成浏览器 UA
#user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36
